<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Registration</title>

</head>
<body>

<div class="container">

<form action="#" method="post">

<h1>Employee Registration</h1>

<!-- Personal Information -->

<fieldset>

<legend>Personal Information</legend>

<div class="form-group">

<div class="input-box">
<label>Full Name</label>
<input type="text" name="fullname" placeholder="Enter Full Name" required>
</div>
<br></br>
<div class="input-box">
<label>Email</label>
<input type="email" name="email" placeholder="Enter Email" required>
</div>
<br></br>
<div class="input-box">
<label>Password</label>
<input type="password" name="password" placeholder="Enter Password" required>
</div>
<br></br>
<div class="input-box">
<label>Phone Number</label>
<input type="tel" name="phone" placeholder="Enter Phone Number" required>
</div>
<br></br>
<div class="input-box">
<label>Age</label>
<input type="number" name="age" min="18" max="60" placeholder="Enter Age">
</div>
<br></br>
<div class="input-box">
<label>Date of Birth</label>
<input type="date" name="dob">
</div>
<br></br>
<div class="input-box">
<label>Joining Time</label>
<input type="time" name="joiningTime">
</div>
<br></br>
<div class="input-box">
<label>Joining Month</label>
<input type="month" name="joiningMonth">
</div>
<br></br>
<div class="input-box">
<label>Interview Date</label>
<input type="date" name="interviewDate">
</div>
<br></br>
</div>

</fieldset>

<div class="button-box">
<button type="submit">Register</button>
</div>

</form>

</div>

</body>
</html>
